name: Validate UI release
on:
  push:
    branches: [ui/v15.1-compact-choices]
    paths: [.github/workflows/ui-release.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply presentation-only patch and build
        run: |
          git apply --check --unidiff-zero scripts/ui-release.patch
          git apply --unidiff-zero scripts/ui-release.patch
          node scripts/build.cjs
          python3 - <<'PY'
          import hashlib,pathlib
          expected={
            'src/choice-menu.js':'9105db464d48130fc427097702899d20d6aaf8f2961bc8559b398748544f9e91',
            'src/compact-panel.js':'e8043112768a6cfda9ce9c8b9bd4df1c3eb17221e78adfadf75b662d0399143b',
            'src/automation-ui.js':'737fdb45a6bfc8bfb9c58197560140a41a7343048aa6babe62e114e52f817722',
            'scripts/build.cjs':'5965f7b506e12148b29ad4a0ac5d055caa695ab53934ba79854e3e70e9b37b2e',
            'tests/main-upgrade.test.cjs':'88b7f358b45710d05f659fa81b2a32b3e6abc26fc3ccf6275320ec7941d59fec',
            'tests/ui-browser.py':'8ab9a471649e887da19414fea22e7e118a5b95474b644203bfe4b8b02a27b776',
            'README.md':'7a017ecd9b56186a435892b3c0e9f149ff54457e4a52fe385622805894521308',
            'MagicGardenAutoFarm.user.js':'87c2ebf7a327f9d9bf4fbbfa8e38b7c73f2ac96cdfba5e35c9419a8b949e3c12'
          }
          for name,digest in expected.items():
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              assert actual==digest,(name,actual,digest)
              print('Exact tested bytes:',name)
          PY
      - name: Node policy and migration regressions
        run: node --test tests/main-upgrade.test.cjs tests/automation.test.cjs tests/reservations.test.cjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Offline Chromium UI regressions
        run: |
          mkdir -p test-results
          python3 tests/ui-browser.py 2>&1 | tee test-results/browser.log
      - name: Commit exact tested output with a branch lease
        run: |
          git fetch origin ui/v15.1-compact-choices --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add MagicGardenAutoFarm.user.js src/automation-ui.js scripts/build.cjs tests/main-upgrade.test.cjs README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: verified V15.1.0 compact UI and choice menus [skip ci]'
          git push origin HEAD:refs/heads/ui/v15.1-compact-choices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-release-validation
          path: |
            test-results/
            MagicGardenAutoFarm.user.js
          retention-days: 3
