name: Compact menu staging
on:
  push:
    branches: [ui/v15.1-compact-menu]
    paths: [.github/workflows/compact-menu-stage.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate UI and run existing regressions
        run: |
          python scripts/prepare-compact-menu.py
          node scripts/build.cjs
          node --check MagicGardenAutoFarm.user.js
          node --test tests/main-upgrade.test.cjs tests/automation.test.cjs tests/reservations.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance (offline mock game)
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser/compact_menu.py
      - name: Retain exact tested output and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-menu-tested
          path: |
            src/
            scripts/
            tests/
            MagicGardenAutoFarm.user.js
            README.md
            test-output/
          retention-days: 3
  stage:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui/v15.1-compact-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: compact-menu-tested
          path: /tmp/compact-menu-tested
      - name: Commit only the validated changes with a branch-head lease
        run: |
          for file in src/automation-ui.js scripts/build.cjs tests/main-upgrade.test.cjs MagicGardenAutoFarm.user.js README.md; do
            cp "/tmp/compact-menu-tested/$file" "$file"
            git add "$file"
          done
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin ui/v15.1-compact-menu --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(ui): stage validated V15.1.0 compact menu [skip ci]'
          git push origin HEAD:refs/heads/ui/v15.1-compact-menu
