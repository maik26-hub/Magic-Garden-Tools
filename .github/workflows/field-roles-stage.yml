name: Field roles staging
on:
  push:
    branches: [feature/v15.2-field-roles-and-choices]
    paths: [.github/workflows/field-roles-stage.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate exact source and validate role policies
        run: |
          python scripts/prepare-field-roles.py
          node scripts/build.cjs
          test "$(git hash-object MagicGardenAutoFarm.user.js)" = '312560a8cbb37d4629452186367320d530abc2d5'
          node --check MagicGardenAutoFarm.user.js
          node --test tests/main-upgrade.test.cjs tests/automation.test.cjs tests/reservations.test.cjs tests/field-roles.test.cjs
      - name: Install Chromium for UI acceptance
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser checks (offline mock game, no account requests)
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser/compact_menu.py
          python tests/browser/field_choices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-field-roles
          path: |
            MagicGardenAutoFarm.user.js
            src/
            scripts/
            tests/
            test-output/
          retention-days: 3
  stage:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tested-field-roles
          path: /tmp/tested-field-roles
      - name: Commit only validated changes using a branch-head lease
        run: |
          cp /tmp/tested-field-roles/MagicGardenAutoFarm.user.js MagicGardenAutoFarm.user.js
          cp /tmp/tested-field-roles/src/automation-core.js src/automation-core.js
          cp /tmp/tested-field-roles/scripts/build.cjs scripts/build.cjs
          cp /tmp/tested-field-roles/tests/main-upgrade.test.cjs tests/main-upgrade.test.cjs
          cp /tmp/tested-field-roles/tests/automation.test.cjs tests/automation.test.cjs
          git add MagicGardenAutoFarm.user.js src/automation-core.js scripts/build.cjs tests/main-upgrade.test.cjs tests/automation.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin feature/v15.2-field-roles-and-choices --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: stage validated V15.2 field roles and catalog menus [skip ci]'
          git push origin HEAD:refs/heads/feature/v15.2-field-roles-and-choices
