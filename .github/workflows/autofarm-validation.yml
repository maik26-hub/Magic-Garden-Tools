name: AutoFarm validation
on:
  push:
    branches: [feature/v15-automation-engine]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate current release
        run: |
          node --version
          node --check MagicGardenAutoFarm.user.js
          node --test tests/main-upgrade.test.cjs
      - name: Archive validation sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofarm-validation-sources
          path: |
            MagicGardenAutoFarm.user.js
            tests/
            README.md
          retention-days: 3
