name: AutoFarm validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rebuild and verify the exact distributed userscript
        run: |
          node --version
          node scripts/build.cjs
          git diff --exit-code -- MagicGardenAutoFarm.user.js
          node --check MagicGardenAutoFarm.user.js
          node --check src/automation-core.js
          node --check src/automation-ui.js
          node --check src/field-plan.js
          node --check src/choice-controls.js
          node --check src/catalog-source.js
          node --check src/update-fetch.js
          node --check src/pet-advisor.js
          node --check src/pet-automation.js
          node --check src/effect-teams.js
          node --check src/team-registry.js
          node --check src/team-actions.js
          node --check src/v16-controller.js
          node --check src/info-tooltips.js
          node --test tests/main-upgrade.test.cjs tests/automation.test.cjs tests/reservations.test.cjs tests/field-roles.test.cjs tests/catalog-source.test.cjs tests/egg-filters.test.cjs tests/updater.test.cjs tests/pet-advisor.test.cjs tests/pet-automation.test.cjs tests/v16.test.cjs tests/hutch-autosell.test.cjs
      - name: Archive validated source and tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofarm-validation-sources
          path: |
            MagicGardenAutoFarm.user.js
            src/
            scripts/
            tests/
            README.md
            AUTOMATION.md
            FIELD-ROLES.md
          retention-days: 3
