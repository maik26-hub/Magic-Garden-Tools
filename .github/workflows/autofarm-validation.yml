name: AutoFarm validation
on:
  push:
    branches: [feature/v15-automation-engine]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and validate all current release policies
        run: |
          node --version
          node scripts/prepare-release.cjs
          node scripts/build.cjs
          node --check MagicGardenAutoFarm.user.js
          node --check src/automation-core.js
          node --check src/automation-ui.js
          node --test tests/main-upgrade.test.cjs tests/automation.test.cjs
      - name: Archive validation sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofarm-validation-sources
          path: |
            MagicGardenAutoFarm.user.js
            src/
            scripts/
            tests/
            README.md
          retention-days: 3
  commit-bundle:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v15-automation-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: autofarm-validation-sources
          path: /tmp/autofarm-validated
      - name: Commit only the exact tested output, with branch lease
        run: |
          cp /tmp/autofarm-validated/MagicGardenAutoFarm.user.js MagicGardenAutoFarm.user.js
          cp /tmp/autofarm-validated/src/automation-core.js src/automation-core.js
          cp /tmp/autofarm-validated/tests/main-upgrade.test.cjs tests/main-upgrade.test.cjs
          git add MagicGardenAutoFarm.user.js src/automation-core.js tests/main-upgrade.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin feature/v15-automation-engine --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish validated V15 bundle on feature branch [skip ci]'
          git push origin HEAD:refs/heads/feature/v15-automation-engine
